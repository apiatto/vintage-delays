name: build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            name: macOS
          - os: windows-2022
            name: Windows
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Regression tests
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Upload plugins
        uses: actions/upload-artifact@v4
        with:
          name: plugins-${{ matrix.name }}
          path: |
            build/plugins/*/*_artefacts/Release/VST3
            build/plugins/*/*_artefacts/Release/AU
            build/plugins/*/*_artefacts/Release/Standalone
